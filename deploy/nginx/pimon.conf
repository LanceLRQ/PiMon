# PiMon 的 nginx 反向代理示例。
#
# 用法：放到 /etc/nginx/conf.d/pimon.conf（或 sites-available 并链接到 sites-enabled），
# 按需改 server_name、证书路径与上游地址，然后 sudo nginx -t && sudo systemctl reload nginx。
#
# 反代生效前，必须在 PiMon 的「设置 -> 网络与安全 -> 受信任反代」里添加 nginx 所在地址：
#   nginx 与 hub 在同一台机器：添加 127.0.0.1 与 ::1
#   nginx 在另一台机器：添加那台机器的 IP
# 否则登录限流会把所有人当成同一个来源，HTTPS 下的 Secure Cookie 也不会生效。
#
# 首次设置（创建管理员）请直连 http://<树莓派 IP>:31415 完成，不要经 HTTPS 反代。
#
# 下面有两个 server 块：
#   1) HTTP 示例：只做反代，适合局域网内的明文访问。
#   2) HTTPS 示例：80 端口跳转到 443，443 端口终结 TLS。
# 二选一，不要同时启用同一个 server_name 的两个 80 端口块。

# 只对 WebSocket 升级请求设置 Connection: upgrade，普通请求保持 Connection 为空，
# 这样上游连接可以复用。
map $http_upgrade $pimon_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream pimon_hub {
    server 127.0.0.1:31415;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# 1) HTTP 示例
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pimon.example.lan;

    location / {
        proxy_pass http://pimon_hub;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $pimon_connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # WebSocket（/ws）是长连接，超时放宽到 1 小时。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

