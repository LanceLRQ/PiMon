name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # 先构建前端（hub 内嵌其产物，测试也依赖），测试通过后再构建 hub（linux/arm64、darwin/arm64）；build-go 会连带交叉编译三个平台的 agent 并内嵌进 hub。
      - name: 构建前端
        run: make web
      - name: 测试
        run: make test-go
      - name: 构建
        run: make build-go VERSION=${{ github.ref_name }}
      - name: 生成校验和
        run: cd bin && sha256sum pimon-hub-* pimon-agent-* > SHA256SUMS
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/pimon-hub-linux-arm64
            bin/pimon-hub-darwin-arm64
            bin/pimon-agent-linux-amd64
            bin/pimon-agent-linux-arm64
            bin/pimon-agent-darwin-arm64
            bin/SHA256SUMS
